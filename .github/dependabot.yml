# Dependabot: weekly pull requests with updates of the dependencies, and security updates as soon as a vulnerability
# is known. Minor and patch updates come as one pull request per area. Major versions of packages are not proposed:
# they may need code changes (see client/AGENTS.md about Next.js) and are done by hand when there is time.

version: 2
updates:
  - package-ecosystem: github-actions  # the commit hashes in .github/workflows/
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv  # server/pyproject.toml + uv.lock
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server:
        update-types: [minor, patch]
    ignore:  # no major versions: they may need code changes; security updates still come
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv  # the evaluation scripts (run locally, not deployed)
    directory: /eval
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      eval:
        update-types: [minor, patch]
    ignore:  # no major versions: they may need code changes; security updates still come
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm  # client/package.json + package-lock.json
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client:
        update-types: [minor, patch]
    ignore:  # no major versions: they may need code changes; security updates still come
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
