name: CI

# Lint and tests for the server (ruff, pytest) and the client (ESLint, TypeScript, Vitest).
# No secrets are needed: the server tests use an in-memory database and file store and never call a model.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Lint (ruff)
        run: uvx ruff check .
      - name: Tests (pytest)
        run: uv run --locked pytest -q

  client:
    name: Client (ESLint, TypeScript, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests (Vitest)
        run: npm test
