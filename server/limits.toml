# Limits of the app (read by app/core/limits.py once at startup; restart the server after changing them).
#
# These are not secrets: they are committed, so every change is visible in git. The server enforces them; they
# cannot be changed through the API or the app. Every value must be greater than 0 (there is no "unlimited"),
# and the same limits apply to every user, the admin too. An invalid value stops the server with a message.
#
# Each value can be overridden by an environment variable (e.g. in server/.env) named
# LIMIT_<SECTION>_<NAME> in capitals, e.g. LIMIT_PER_USER_COST_PER_DAY_USD=2.

# Each signed-in user counts separately.
[per_user]
model_requests_per_minute = 20    # requests that call a model (ask, generate, search, upload, ...); protects against loops
cost_per_day_usd          = 1.00  # after that, 429 "daily budget used up" until midnight UTC
cost_per_month_usd        = 10.00 # calendar month, UTC
max_books                 = 20    # books (sources) in the user's library
max_upload_mb             = 50    # size of one uploaded file (Supabase Storage's limit on the free plan)
max_api_keys              = 10    # personal API keys for the MCP servers (e.g. one per tool)

# The whole app (all users together): protects the API key's budget even with many users.
[app]
cost_per_day_usd = 20.00
