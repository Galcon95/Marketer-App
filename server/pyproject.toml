[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=46",
    "fastapi[standard]>=0.143.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langsmith>=0.16.0",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Correctness only (syntax errors, undefined or unused names). Pinned so CI does not change with
# ruff's default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the app package
