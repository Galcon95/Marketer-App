[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.143.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import the app package
